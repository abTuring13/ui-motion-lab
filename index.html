<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI Motion Lab</title>
<meta name="description" content="Code-driven UI motion: a single-shape morph loop and a cursor-follow share button." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="dashboard/dashboard.css" />
<style>
  :root { --light: #ffffff; --dark: #000000; --ink: #111111; --dim-light: #9a9a9a; --dim-dark: #6d6f78; }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
  html, body { margin: 0; }
  body { font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--dark); -webkit-font-smoothing: antialiased; }

  body > section { position: relative; height: 100vh; height: 100svh; scroll-snap-align: start; overflow: hidden; }
  body > section.light { background: var(--light); }
  body > section.dark { background: var(--dark); }
  body > section.mid { height: auto; min-height: 100vh; min-height: 100svh; overflow: visible; background: #eeece8; display: flex; align-items: center; }
  body > section.mid #dashboard { width: 100%; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }

  .hint {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 13px; letter-spacing: .02em; text-decoration: none; color: var(--dim-light);
  }
  .hint svg { width: 16px; height: 16px; }
  .hint:hover { color: var(--ink); }
  .hint:focus-visible, .source:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 4px; }

  .source {
    position: absolute; right: 20px; bottom: 20px; font-size: 13px; text-decoration: none; color: var(--dim-dark);
  }
  .source:hover { color: #f7f7fa; }
  .title {
    position: absolute; left: 20px; top: 18px; font-size: 13px; font-weight: 500; color: var(--dim-light); pointer-events: none;
  }
  .dark .title { color: var(--dim-dark); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
  <section class="light" aria-label="Morph loop">
    <iframe src="morph/?embed" title="Morph loop: one shape morphing through twelve UI states"></iframe>
    <span class="title">Morph Loop</span>
    <a class="hint" href="#dashboard-section">
      Scroll
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </a>
  </section>

  <section class="mid" id="dashboard-section" aria-label="Interactive dashboard">
    <div id="dashboard"></div>
  </section>

  <section class="dark" id="share" aria-label="Cursor share button">
    <iframe src="share-button/?embed" title="Share button with an orb that follows the cursor"></iframe>
    <span class="title">Cursor Share Button</span>
    <a class="source" href="https://github.com/abTuring13/ui-motion-lab">Source on GitHub ↗</a>
  </section>
  <script src="dashboard/dashboard.js"></script>
</body>
</html>
