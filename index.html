<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI Motion Lab</title>
<meta name="description" content="Code-driven UI motion: a morph loop, an interactive dashboard, a launch film on the beat and a cursor-follow share button." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="dashboard/dashboard.css" />
<script>
  // One audio owner for the whole page: whoever starts playing silences the rest.
  window.SiteAudio = {
    owner: null,
    claim(id, stop) { if (this.owner && this.owner.id !== id) { try { this.owner.stop(); } catch { /* gone */ } } this.owner = { id, stop }; },
    release(id) { if (this.owner && this.owner.id === id) this.owner = null; },
  };
</script>
<style>
  :root { --light: #ffffff; --dark: #000000; --ink: #111111; --dim-light: #9a9a9a; --dim-dark: #6d6f78; }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
  html, body { margin: 0; }
  body { font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--dark); -webkit-font-smoothing: antialiased; }

  body > section { position: relative; height: 100vh; height: 100svh; scroll-snap-align: start; overflow: hidden; }
  body > section.light { background: var(--light); }
  body > section.dark { background: var(--dark); }
  body > section.mid { height: auto; min-height: 100vh; min-height: 100svh; overflow: visible; background: #eeece8; display: flex; align-items: center; }
  body > section.mid #dashboard { width: 100%; }
  body > section iframe { display: block; width: 100%; height: 100%; border: 0; }

  .scroll-hint {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 13px; letter-spacing: .02em; text-decoration: none; color: var(--dim-light);
  }
  .scroll-hint svg { width: 16px; height: 16px; }
  .scroll-hint:hover { color: var(--ink); }
  .scroll-hint:focus-visible, .source:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 4px; }
  .source { position: absolute; right: 72px; bottom: 20px; font-size: 13px; text-decoration: none; color: var(--dim-dark); }
  .source:hover { color: #f7f7fa; }
  .title { position: absolute; left: 20px; top: 18px; font-size: 13px; font-weight: 500; color: var(--dim-light); pointer-events: none; }
  .dark .title { color: var(--dim-dark); }

  /* ---------- right-side tick rail ---------- */
  .rail {
    position: fixed; right: 14px; top: 50%; z-index: 40; width: 40px; height: min(440px, 58vh);
    transform: translateY(-50%); border-radius: 20px; cursor: pointer; touch-action: none; user-select: none;
    background: rgba(17,17,17,.86); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 14px 34px -14px rgba(0,0,0,.5);
  }
  .rail-in { position: absolute; left: 0; right: 0; top: 18px; bottom: 18px; }
  .rail-in i {
    position: absolute; left: 50%; width: 8px; height: 1.5px; margin: -.75px 0 0 -4px; border-radius: 1px;
    background: #4a4a4a; transform-origin: 50% 50%; transition: transform .18s cubic-bezier(.2,.9,.3,1), background .18s ease;
  }
  .rail-in button {
    position: absolute; left: 0; width: 100%; height: 22px; margin-top: -11px; padding: 0; border: 0; background: none; cursor: pointer;
  }
  .rail-in button::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 2px; margin: -1px 0 0 -8px; border-radius: 1px;
    background: #8a8a8a; transition: background .18s ease, transform .18s cubic-bezier(.2,.9,.3,1);
  }
  .rail-in button:hover::after, .rail-in button.on::after { background: #d6d6d6; }
  .rail-in button:focus-visible { outline: 2px solid #ededed; outline-offset: -2px; border-radius: 6px; }
  .rail-head { position: absolute; left: 50%; top: 0; width: 24px; height: 3px; margin: -1.5px 0 0 -12px; border-radius: 2px; background: #fff; pointer-events: none; }
  .rail-tip {
    position: absolute; right: 52px; top: 0; padding: 7px 11px; border-radius: 10px; white-space: nowrap; pointer-events: none;
    background: rgba(17,17,17,.9); color: #ededed; font-size: 13px; font-weight: 500; letter-spacing: -.01em;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    opacity: 0; transform: translate(6px, -50%); transition: opacity .15s ease, transform .25s cubic-bezier(.2,.9,.3,1);
  }
  .rail.hover .rail-tip, .rail.drag .rail-tip { opacity: 1; transform: translate(0, -50%); }
  .rail-tip span { color: #7a7a7a; margin-right: 6px; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .rail { right: 6px; width: 30px; height: 46vh; } .source { right: 48px; } }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .rail-in i, .rail-in button::after { transition: none; } }
</style>
</head>
<body>
  <section class="light" id="morph-section" data-name="Morph loop" aria-label="Morph loop">
    <iframe src="morph/?embed" title="Morph loop: one shape morphing through twelve UI states"></iframe>
    <span class="title">Morph Loop</span>
    <a class="scroll-hint" href="#dashboard-section">
      Scroll
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </a>
  </section>

  <section class="mid" id="dashboard-section" data-name="Dashboard" aria-label="Interactive dashboard">
    <div id="dashboard"></div>
  </section>

  <section class="dark" id="film-section" data-name="Launch film" aria-label="Launch film">
    <iframe src="film/" title="Launch film: ten bars cut to the beat" allow="autoplay"></iframe>
    <span class="title">Launch Film</span>
  </section>

  <section class="dark" id="share" data-name="Share" aria-label="Cursor share button">
    <iframe src="share-button/?embed" title="Share button with an orb that follows the cursor" allow="clipboard-write"></iframe>
    <span class="title">Cursor Share Button</span>
    <a class="source" href="https://github.com/abTuring13/ui-motion-lab">Source on GitHub ↗</a>
  </section>

  <nav class="rail" id="rail" aria-label="Page sections">
    <div class="rail-in" id="railIn"><b class="rail-head" id="railHead"></b></div>
    <div class="rail-tip" id="railTip"></div>
  </nav>

  <script src="dashboard/dashboard.js"></script>
  <script>
  /* Tick rail: shows where you are, drag to scrub the page, click a section marker to jump. */
  (() => {
    const rail = document.getElementById('rail'), inner = document.getElementById('railIn');
    const head = document.getElementById('railHead'), tip = document.getElementById('railTip');
    const sections = [...document.querySelectorAll('body > section')];
    const TICKS = 36, root = document.documentElement;
    const ticks = Array.from({ length: TICKS + 1 }, (_, i) => {
      const el = document.createElement('i');
      el.style.top = (i / TICKS * 100) + '%';
      inner.insertBefore(el, head);
      return { el, f: i / TICKS };
    });
    const maxScroll = () => Math.max(1, root.scrollHeight - innerHeight);
    const marks = sections.map((s, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', `Go to ${s.dataset.name}`);
      b.addEventListener('click', e => { if (e.detail === 0) s.scrollIntoView({ behavior: 'smooth' }); });   // keyboard; pointer taps are handled by the rail
      inner.insertBefore(b, head);
      return { el: b, s, name: s.dataset.name, i, f: 0 };
    });
    function layout() { marks.forEach(m => { m.f = Math.min(1, m.s.offsetTop / maxScroll()); m.el.style.top = (m.f * 100) + '%'; }); }
    const sectionAt = f => marks.reduce((cur, m) => (f + 0.002 >= m.f ? m : cur), marks[0]);

    // the head follows the scroll position on a spring
    let x = 0, v = 0, last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const target = scrollY / maxScroll();
      for (let i = 0, n = Math.ceil(dt * 240) || 1; i < n; i++) { v += (-300 * (x - target) - 34 * v) * (dt / n); x += v * (dt / n); }
      head.style.top = (Math.max(0, Math.min(1, x)) * 100).toFixed(3) + '%';
      const cur = sectionAt(target);
      marks.forEach(m => m.el.classList.toggle('on', m === cur));
      requestAnimationFrame(frame);
    }

    // hover: ticks near the pointer swell, the tooltip names the section under it
    const fracAt = e => { const r = inner.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)); };
    function hoverAt(e) {
      const f = fracAt(e), r = inner.getBoundingClientRect();
      ticks.forEach(t => { const d = Math.abs(t.f - f) * r.height; const k = Math.max(0, 1 - d / 46); t.el.style.transform = `scaleX(${(1 + 1.1 * k * k).toFixed(3)})`; t.el.style.background = k > 0.6 ? '#9a9a9a' : ''; });
      const m = sectionAt(f);
      tip.innerHTML = `<span>0${m.i + 1}</span>${m.name}`;
      tip.style.top = (e.clientY - rail.getBoundingClientRect().top) + 'px';
    }
    function clearHover() { ticks.forEach(t => { t.el.style.transform = ''; t.el.style.background = ''; }); }
    rail.addEventListener('pointerenter', () => rail.classList.add('hover'));
    rail.addEventListener('pointermove', e => { hoverAt(e); if (dragging) scrubTo(e); });
    rail.addEventListener('pointerleave', () => { rail.classList.remove('hover'); if (!dragging) clearHover(); });

    // drag anywhere on the rail to scrub the page directly
    let dragging = false, moved = false, downY = 0, downMark = null;
    const scrubTo = e => { if (Math.abs(e.clientY - downY) > 3) moved = true; if (moved) root.scrollTop = fracAt(e) * maxScroll(); };
    rail.addEventListener('pointerdown', e => {
      dragging = true; moved = false; downY = e.clientY;
      downMark = marks.find(m => m.el === e.target) || null;
      rail.setPointerCapture(e.pointerId); rail.classList.add('drag');
      root.style.scrollSnapType = 'none'; root.style.scrollBehavior = 'auto';
    });
    const end = e => {
      if (!dragging) return;
      dragging = false; rail.classList.remove('drag');
      root.style.scrollSnapType = ''; root.style.scrollBehavior = '';
      if (!moved) {
        if (downMark) downMark.s.scrollIntoView({ behavior: 'smooth' });
        else window.scrollTo({ top: fracAt(e) * maxScroll(), behavior: 'smooth' });
      }
      if (!rail.matches(':hover')) clearHover();
    };
    rail.addEventListener('pointerup', end);
    rail.addEventListener('pointercancel', end);

    addEventListener('resize', layout);
    new ResizeObserver(layout).observe(document.body);
    layout();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
