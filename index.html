<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI Motion Lab</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #ededed; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; padding: 16px; box-sizing: border-box; }
  main { width: min(520px, 100%); display: grid; gap: 12px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; }
  a { display: block; padding: 18px 20px; border-radius: 14px; background: #1a1a1a; border: 1px solid #262626; color: inherit; text-decoration: none; }
  a:hover { background: #202020; }
  a:focus-visible { outline: 2px solid #ededed; outline-offset: 2px; }
  a b { display: block; font-weight: 500; margin-bottom: 4px; }
  a span { color: #8a8a8a; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>UI Motion Lab</h1>
  <a href="morph/"><b>Morph Loop</b><span>One shape, 12 UI states, 120 BPM, 7 bars, all driven by seek(t)</span></a>
  <a href="share-button/"><b>Cursor Share Button</b><span>Glowing orb that follows your pointer, with a rolling label</span></a>
</main>
</body>
</html>
