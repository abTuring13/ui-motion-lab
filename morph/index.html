<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Morph Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --canvas: #e7e5e0;
    --ink: #111111;
    --paper: #ffffff;
    --soft: #f1efeb;
    --muted: #8d8d8d;
    --page: #111111;
    --page-fg: #ededed;
    --page-dim: #7c7c7c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--page-fg);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- stage (1440 x 1440, scaled to fit) ---------- */
  #frame { position: relative; flex: none; border-radius: 14px; overflow: hidden; }
  #stage {
    position: absolute; left: 0; top: 0; width: 1440px; height: 1440px;
    transform-origin: 0 0; background: var(--canvas); overflow: hidden;
  }
  #world { position: absolute; left: 720px; top: 720px; width: 0; height: 0; transform-origin: 0 0; }
  #shape {
    position: absolute; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px -14px rgba(0,0,0,.22);
  }
  #anchor { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .layer { position: absolute; }

  .ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .glyph { fill: currentColor; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }

  /* button */
  #c-button {
    width: 260px; height: 76px; left: -130px; top: -38px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: #fff; font-size: 23px; font-weight: 500; letter-spacing: -0.02em;
  }
  #c-button svg { width: 22px; height: 22px; }

  /* loader + check */
  #c-loader { width: 40px; height: 40px; left: -20px; top: -20px; }
  #c-loader svg { width: 40px; height: 40px; display: block; }
  #c-loader .track { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 3.5; }
  #c-loader .arc { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; }
  #c-check { width: 34px; height: 34px; left: -17px; top: -17px; color: #fff; }
  #c-check svg { width: 34px; height: 34px; display: block; stroke-width: 2.2; }

  /* dynamic island */
  #c-island {
    width: 340px; height: 60px; left: -170px; top: -30px;
    display: flex; align-items: center; gap: 12px; padding: 0 20px 0 12px; color: #fff;
  }
  .art { background: #f2f0ec; display: grid; place-items: center; flex: none; }
  .disc { background: var(--ink); border-radius: 50%; display: grid; place-items: center; }
  .disc::after { content: ""; width: 28%; height: 28%; border-radius: 50%; background: #f2f0ec; }
  #c-island .art { width: 36px; height: 36px; border-radius: 10px; }
  #c-island .disc { width: 20px; height: 20px; }
  .i-text { flex: 1; min-width: 0; line-height: 1.2; }
  .i-title { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .i-sub { font-size: 13px; color: var(--muted); }
  .bars { display: flex; align-items: center; gap: 3px; height: 26px; }
  .bars i { display: block; width: 3.5px; border-radius: 2px; background: #fff; }

  /* music player */
  #c-player { width: 520px; height: 252px; left: -260px; top: -126px; color: #fff; }
  #c-player > * { position: absolute; }
  #c-player .art { left: 28px; top: 28px; width: 72px; height: 72px; border-radius: 16px; }
  #c-player .disc { width: 38px; height: 38px; }
  .p-title { left: 118px; top: 36px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .p-sub { left: 118px; top: 67px; font-size: 16px; color: var(--muted); }
  .p-vol {
    left: 452px; top: 32px; width: 40px; height: 40px; border-radius: 20px;
    background: #262626; display: grid; place-items: center;
  }
  .p-vol svg { width: 20px; height: 20px; }
  .p-bar { left: 28px; width: 464px; border-radius: 6px; background: #363636; }
  .p-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: #fff; }
  .p-knob {
    position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .p-time { top: 148px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .p-time.l { left: 28px; } .p-time.r { right: 28px; }
  .p-ctrl { top: 182px; width: 36px; height: 36px; display: grid; place-items: center; }
  .p-ctrl svg { width: 22px; height: 22px; }
  .p-ctrl.prev { left: 152px; } .p-ctrl.next { left: 332px; }
  .p-play {
    left: 229px; top: 169px; width: 62px; height: 62px; border-radius: 50%;
    background: #fff; color: var(--ink); display: grid; place-items: center;
  }
  .p-play svg { width: 26px; height: 26px; }

  /* volume slider (layer is the full shape, sized every frame) */
  #c-volume { background: var(--paper); }
  .v-fill { position: absolute; left: 6px; top: 6px; background: var(--ink); }
  .v-ico { position: absolute; width: 24px; height: 24px; color: #fff; }
  .v-num {
    position: absolute; right: 28px; top: 50%; transform: translateY(-50%);
    font-size: 20px; font-weight: 500; color: #fff; mix-blend-mode: difference;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }

  /* toggle knob / tab indicator (one element) + tab row */
  #tabBg, #blob, #tabLabels { position: absolute; }
  #tabLabels span {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    font-size: 18px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap;
  }

  /* chart */
  #c-chart { width: 640px; height: 460px; left: -320px; top: -230px; color: var(--ink); }
  #c-chart > * { position: absolute; }
  .ch-label { left: 32px; top: 94px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .ch-value { left: 32px; top: 114px; font-size: 40px; font-weight: 600; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 12px; }
  .chip { font-size: 14px; font-weight: 500; letter-spacing: 0; background: var(--soft); border-radius: 999px; padding: 5px 10px; }
  #plot { left: 32px; top: 186px; overflow: visible; }
  #plot .grid line { stroke: #ecebe7; stroke-width: 1; }
  #line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  #area { fill: rgba(17,17,17,.05); }
  #guide { stroke: #cfcbc4; stroke-width: 1.5; stroke-dasharray: 4 5; }
  #dot { fill: #fff; stroke: var(--ink); stroke-width: 3; }
  .ch-months { left: 32px; top: 414px; width: 576px; height: 20px; font-size: 13px; color: #9a9a9a; }
  .ch-months span { position: absolute; transform: translateX(-50%); }
  .tip {
    background: var(--ink); color: #fff; border-radius: 12px; padding: 8px 12px;
    font-size: 14px; white-space: nowrap; display: flex; gap: 8px; align-items: baseline;
    box-shadow: 0 6px 16px -6px rgba(0,0,0,.35);
  }
  .tip span { color: #a3a3a3; }
  .tip b { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ⌘K */
  #c-cmdk {
    width: 120px; height: 120px; left: -60px; top: -60px;
    display: grid; place-items: center; color: var(--ink);
    font-size: 40px; font-weight: 500; letter-spacing: -0.02em;
  }

  /* command palette */
  #c-palette { width: 620px; height: 341px; left: -310px; color: var(--ink); }
  #c-palette > * { position: absolute; }
  .pl-input { left: 0; top: 0; width: 620px; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 20px 0 22px; }
  .pl-input svg { width: 22px; height: 22px; color: #7a7a7a; flex: none; }
  .pl-q { flex: 1; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; height: 28px; }
  #plCaret { display: inline-block; width: 2px; height: 24px; background: var(--ink); margin-left: 1px; }
  #plPh { color: #a8a8a8; margin-left: -3px; }
  .kbd { font-size: 13px; font-weight: 500; color: #6f6f6f; background: var(--soft); border-radius: 7px; padding: 4px 8px; }
  .pl-div { left: 0; top: 64px; width: 620px; height: 1px; background: #eceae6; }
  .pl-hl { left: 8px; top: 73px; width: 604px; height: 52px; border-radius: 12px; }
  .pl-hl .kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
  .pl-row { left: 8px; width: 604px; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 17px; letter-spacing: -0.01em; }
  .pl-row svg { width: 20px; height: 20px; flex: none; }
  .pl-row b { font-weight: 600; }

  /* toast */
  #c-toast {
    width: 360px; height: 72px; left: -180px; top: -36px;
    display: flex; align-items: center; gap: 12px; padding: 0 28px 0 24px; color: #fff;
  }
  #c-toast svg { width: 26px; height: 26px; flex: none; }
  .t-msg { flex: 1; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; }
  .t-undo { font-size: 17px; color: var(--muted); }

  /* cursor (screen space, constant size) */
  #cursor { position: absolute; left: 0; top: 0; width: 58px; height: 58px; transform-origin: 12.43px 7.25px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.22)); }

  /* ---------- controls ---------- */
  #controls { display: flex; align-items: center; gap: 14px; height: 40px; font-size: 13px; color: var(--page-dim); user-select: none; }
  #controls button {
    height: 32px; min-width: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid #2a2a2a;
    background: #1b1b1b; color: var(--page-fg); font: inherit; cursor: pointer; display: grid; place-items: center;
  }
  #controls button:hover { background: #242424; }
  #controls button:focus-visible { outline: 2px solid #ededed; outline-offset: 2px; }
  #controls svg { width: 14px; height: 14px; }
  #scrub { position: relative; height: 32px; cursor: pointer; touch-action: none; }
  #scrub i { position: absolute; bottom: 8px; width: 2px; margin-left: -1px; background: #3a3a3a; border-radius: 1px; height: 8px; }
  #scrub i.bar { height: 16px; background: #5a5a5a; }
  #playhead { position: absolute; top: 2px; bottom: 2px; width: 2px; margin-left: -1px; background: #ededed; border-radius: 1px; }
  #readout { min-width: 190px; font-variant-numeric: tabular-nums; color: var(--page-fg); }
  #readout em { font-style: normal; color: var(--page-dim); }

  html.render body { padding: 0; background: var(--canvas); }
  html.render #frame { border-radius: 0; }
  html.render #controls { display: none; }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <div id="world">
      <div id="shape">
        <div id="anchor">
          <div class="layer" id="c-button">
            <span>Get started</span>
            <svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>

          <div class="layer" id="c-loader">
            <svg viewBox="0 0 40 40" id="loaderSvg"><circle class="track" cx="20" cy="20" r="15"/><circle class="arc" id="loaderArc" cx="20" cy="20" r="15"/></svg>
          </div>

          <div class="layer" id="c-check">
            <svg class="ico" viewBox="0 0 24 24"><path id="checkPath" pathLength="1" stroke-dasharray="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </div>

          <div class="layer" id="c-island">
            <div class="art"><div class="disc"></div></div>
            <div class="i-text"><div class="i-title">Midnight Loop</div><div class="i-sub">Vortex</div></div>
            <div class="bars" id="islandBars"><i></i><i></i><i></i><i></i><i></i></div>
          </div>

          <div class="layer" id="c-player">
            <div class="art"><div class="disc"></div></div>
            <div class="p-title">Midnight Loop</div>
            <div class="p-sub">Vortex · Night Drive</div>
            <div class="p-vol" id="pVol"><svg class="ico" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3.5v6h3l4.5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></div>
            <div class="p-bar" id="pBar"><div class="p-fill" id="pFill"></div><div class="p-knob" id="pKnob"></div></div>
            <div class="p-time l" id="pTimeL">0:40</div>
            <div class="p-time r" id="pTimeR">-3:05</div>
            <div class="p-ctrl prev"><svg class="glyph" viewBox="0 0 24 24"><path d="M6 6h2.2v12H6z"/><path d="M19 6.5v11L9.8 12z"/></svg></div>
            <div class="p-play" id="pPlay"><svg class="glyph" viewBox="0 0 24 24"><path id="pp1"/><path id="pp2"/></svg></div>
            <div class="p-ctrl next"><svg class="glyph" viewBox="0 0 24 24"><path d="M15.8 6H18v12h-2.2z"/><path d="M5 6.5v11l9.2-5.5z"/></svg></div>
          </div>

          <div class="layer" id="c-volume">
            <div class="v-fill" id="vFill"></div>
            <svg class="ico v-ico" id="vIco" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3.5v6h3l4.5 4z"/><path id="vW1" d="M15.5 9a4 4 0 0 1 0 6"/><path id="vW2" d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
            <div class="v-num" id="vNum">45</div>
          </div>

          <div id="tabBg"></div>
          <div id="blob"></div>
          <div id="tabLabels"><span>Daily</span><span>Weekly</span><span>Monthly</span></div>

          <div class="layer" id="c-chart">
            <div class="ch-label">Revenue</div>
            <div class="ch-value"><span id="chNum">$48,290</span><span class="chip">+12.4%</span></div>
            <svg id="plot" width="576" height="220" viewBox="0 0 576 220">
              <defs><clipPath id="reveal"><rect id="revealRect" x="-12" y="-24" width="0" height="268"/></clipPath></defs>
              <g class="grid"><line x1="0" x2="576" y1="1" y2="1"/><line x1="0" x2="576" y1="73" y2="73"/><line x1="0" x2="576" y1="146" y2="146"/><line x1="0" x2="576" y1="219" y2="219"/></g>
              <g clip-path="url(#reveal)"><path id="area"/><path id="line"/></g>
              <line id="guide" y1="0" y2="220"/>
              <circle id="dot" r="6.5"/>
            </svg>
            <div class="ch-months" id="months"></div>
            <div class="tip" id="tip"><span id="tipM">Oct</span><b id="tipV">$41.0k</b></div>
          </div>

          <div class="layer" id="c-cmdk">⌘K</div>

          <div class="layer" id="c-palette">
            <div class="pl-input">
              <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
              <div class="pl-q"><span id="plText"></span><i id="plCaret"></i><span id="plPh">Type a command…</span></div>
              <span class="kbd">esc</span>
            </div>
            <div class="pl-div"></div>
            <div class="pl-hl" id="plHl"><span class="kbd" id="plEnter">↵</span></div>
          </div>

          <div class="layer" id="c-toast">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path id="toastCheck" pathLength="1" stroke-dasharray="1" d="M8 12.5l2.7 2.7L16 9.5"/></svg>
            <span class="t-msg">Invite sent</span>
            <span class="t-undo">Undo</span>
          </div>
        </div>
      </div>
    </div>
    <svg id="cursor" viewBox="0 0 28 28"><path d="M6 3.5v18.2l4.6-4.3 3 6.9 3.1-1.3-3-6.8h6.3z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
</div>

<div id="controls">
  <button id="playBtn" aria-label="Pause"></button>
  <div id="scrub" aria-label="Timeline"><div id="playhead"></div></div>
  <span id="readout"></span>
  <button id="soundBtn" aria-pressed="false">Sound off</button>
</div>

<script>
/* =====================================================================
   Morph Loop — one shape, 12 UI states, 120 BPM, 7 bars (14 s).
   Everything visible is a pure function of t inside seek(t):
   no CSS transitions, no timers, nothing carried between frames.
   ===================================================================== */

const BPM = 120, BEAT = 60 / BPM, BARS = 7;
const P = BARS * 4 * BEAT; // 14 s loop

/* ---------- math ---------- */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const mix = (a, b, k) => a + (b - a) * k;
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const easeIn = x => Math.pow(clamp01(x), 2);
const easeInOut = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb = c => `rgb(${c.map(x => Math.round(Math.max(0, Math.min(255, x)))).join(',')})`;
const mixC = (a, b, k) => a.map((x, i) => mix(x, b[i], k));

/* Closed-form step response of a damped spring (0 → 1). */
function springStep(t, w, z) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}

const SP = {
  shape:   { w: 15, z: 0.84 },   // ~1% overshoot, settles inside a beat
  camera:  { w: 10, z: 0.96 },
  cursor:  { w: 13, z: 1 },
  drag:    { w: 7,  z: 1 },
  lead:    { w: 24, z: 0.82 },   // leading edge of the knob / indicator
  trail:   { w: 10, z: 0.9 },    // trailing edge
  fast:    { w: 24, z: 0.9 },
  press:   { w: 34, z: 0.75 },
  release: { w: 17, z: 0.64 },   // rubber band snapping back
};

/* A value that changes target many times = sum of one spring per change.
   Each step is also added one period early, so the track loops seamlessly
   (the last target must equal the initial value). */
function track(init, keys, sp = SP.shape) {
  let prev = init;
  const steps = keys.map(([t, v, s]) => { const d = v - prev; prev = v; return { t, d, s: s || sp }; });
  if (Math.abs(prev - init) > 1e-6) console.warn('track does not loop', init, prev);
  return t => {
    let v = init;
    for (const k of steps) v += k.d * (springStep(t - k.t, k.s.w, k.s.z) + springStep(t + P - k.t, k.s.w, k.s.z));
    return v;
  };
}

/* Content visibility with its own enter/exit timing (wraps around the loop). */
function vis(t, tin, tout, delay = 0.06, enter = 0.22, exit = 0.12) {
  if (tout < tin) tout += P;
  const f = x => easeOut((x - tin - delay) / enter) * (1 - easeIn((x - tout) / exit));
  return Math.max(f(t), f(t + P), f(t - P));
}

/* ---------- states on the beat grid ---------- */
const GEO = {
  button:   { w: 260, h: 76,  r: 38, bg: '#111111' },
  loader:   { w: 76,  h: 76,  r: 38, bg: '#111111' },
  check:    { w: 76,  h: 76,  r: 38, bg: '#111111' },
  island:   { w: 340, h: 60,  r: 30, bg: '#111111' },
  player:   { w: 520, h: 252, r: 40, bg: '#111111', cam: 1.65 },
  volume:   { w: 520, h: 76,  r: 38, bg: '#ffffff', cam: 1.55 },
  toggle:   { w: 128, h: 72,  r: 36, bg: '#cfcbc4' },
  toggleOn: { w: 128, h: 72,  r: 36, bg: '#111111' },
  tabs:     { w: 560, h: 72,  r: 36, bg: '#ffffff' },
  chart:    { w: 640, h: 460, r: 36, bg: '#ffffff' },
  cmdk:     { w: 120, h: 120, r: 32, bg: '#ffffff' },
  palette:  { w: 620, h: 341, r: 28, bg: '#ffffff' },
  toast:    { w: 360, h: 72,  r: 36, bg: '#111111' },
};
const camFor = g => g.cam ?? Math.min(3, 900 / Math.max(g.w, g.h * 1.3));

// [time, state, label] — clicks land on the beat, morphs follow the release.
const SEQ = [
  [1.06,  'loader',   'Button → loader'],
  [2.0,   'check',    'Check'],
  [2.5,   'island',   'Dynamic island'],
  [3.06,  'player',   'Player · play → pause'],
  [5.56,  'volume',   'Volume slider'],
  [7.5,   'toggle',   'Toggle'],
  [8.02,  'toggleOn', 'Toggle on'],
  [8.5,   'tabs',     'Liquid tabs'],
  [9.5,   'chart',    'Chart + tooltip'],
  [11.5,  'cmdk',     '⌘K'],
  [12.06, 'palette',  'Type to filter'],
  [13.06, 'toast',    'Toast'],
  [13.5,  'button',   'Button'],
];

/* shape w/h/r, colour and camera */
const shapeTracks = (() => {
  const val = s => { const g = GEO[s]; const [cr, cg, cb] = hex(g.bg); return { w: g.w, h: g.h, r: g.r, cam: camFor(g), cr, cg, cb }; };
  const init = val('button');
  const keys = SEQ.map(([t, s]) => [t, val(s)]);
  // palette shrinks as the list filters (81 + 52 per visible row)
  keys.push([12.5, { h: 237 }, SP.fast], [12.625, { h: 185 }, SP.fast], [12.75, { h: 133 }, SP.fast]);

/* =====================================================================

function seek(tIn) {
  const t = ((tIn % P) + P) % P;

  const cam = T.cam(t);
  const vol = volume(t);
  const st = t > 5.9 && t < 8.5 ? vol.s : 0;

  const W = T.w(t) + st, H = T.h(t) - st * 0.16;
  const cx = st / 2;
  const S = el.shape.style;
  S.left = px(cx - W / 2); S.top = px(-H / 2); S.width = px(W); S.height = px(H);
  S.borderRadius = px(Math.min(T.r(t), H / 2, W / 2));
  S.background = rgb([T.cr(t), T.cg(t), T.cb(t)]);
  S.transform = `scale(${shapePress(t).toFixed(4)})`;
  el.world.style.transform = `scale(${cam.toFixed(4)})`;

  /* content layers: blur swap with their own enter/exit */
  for (const L of LAYERS) {
    const v = L.v = vis(t, L.tin, L.tout, L.delay);
    show(L.el, v > 0.002);
    if (v <= 0.002) continue;
    L.el.style.opacity = v.toFixed(3);
    const b = (1 - v) * 10 / cam;
    L.el.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
    L.el.style.transform = `scale(${(0.955 + 0.045 * v).toFixed(4)})`;
  }

  /* loader + check */
  if (layer['c-loader'].v > 0) {
    const arc = 22 + 32 * (0.5 + 0.5 * Math.sin(t * 7));
    el.loaderArc.setAttribute('stroke-dasharray', `${arc.toFixed(2)} 200`);
    el.loaderSvg.style.transform = `rotate(${(t * 560).toFixed(1)}deg)`;
  }
  if (layer['c-check'].v > 0) el.checkPath.style.strokeDashoffset = (1 - easeOut((t - 2.05) / 0.28)).toFixed(4);

  /* island waveform */
  if (layer['c-island'].v > 0) el.bars.forEach((b, i) => {
    b.style.height = px(6 + 18 * (0.5 + 0.5 * Math.sin(t * 11 + i * 1.7)) * (0.55 + 0.45 * Math.sin(t * 3.1 + i)));

    el.pFill.style.width = (p * 100).toFixed(3) + '%';
    el.pKnob.style.left = (p * 100).toFixed(3) + '%';
    el.pKnob.style.transform = `translate(-50%,-50%) scale(${Math.max(0, k).toFixed(3)})`;
    setText(el.pTimeL, fmtTime(p * DUR));
    setText(el.pTimeR, '-' + fmtTime(DUR - p * DUR));
    const m = playMorph(t);
    el.pp1.setAttribute('d', quad(PLAY[0].map((pt, i) => [mix(pt[0], PAUSE[0][i][0], m), mix(pt[1], PAUSE[0][i][1], m)])));
    el.pp2.setAttribute('d', quad(PLAY[1].map((pt, i) => [mix(pt[0], PAUSE[1][i][0], m), mix(pt[1], PAUSE[1][i][1], m)])));
    el.pPlay.style.transform = `scale(${(1 - 0.1 * playPress(t)).toFixed(4)})`;
    el.pVol.style.transform = `scale(${(1 - 0.12 * volBtnPress(t)).toFixed(4)})`;

      Ls.left = px(x0); Ls.top = px(y0); Ls.width = px(x1 - x0); Ls.height = px(y1 - y0); Ls.opacity = tv.toFixed(3);

for (let b = 0; b < P / BEAT; b++) {
  const i = document.createElement('i');
  if (b % 4 === 0) i.className = 'bar';
  i.style.left = (b / (P / BEAT) * 100) + '%';
  scrub.appendChild(i);
}
const ICON_PAUSE = '<svg viewBox="0 0 14 14"><rect x="3" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="8" y="2" width="3" height="10" rx="1" fill="currentColor"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 14 14"><path d="M4 2.2v9.6L11.5 7z" fill="currentColor"/></svg>';

let playing = !RENDER && !params.has('t');
let t0 = performance.now() / 1000, pausedAt = Number(params.get('t')) || 0, lastT = pausedAt;
const now = () => playing ? ((performance.now() / 1000 - t0) % P + P) % P : pausedAt;
function setPlaying(p) {
  if (p === playing) return;
  if (p) t0 = performance.now() / 1000 - pausedAt; else pausedAt = now();
  playing = p;
  playBtn.innerHTML = p ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
}
function jump(t) { pausedAt = ((t % P) + P) % P; t0 = performance.now() / 1000 - pausedAt; lastT = pausedAt; }
playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
playBtn.onclick = () => setPlaying(!playing);

const scrubTo = e => { const r = scrub.getBoundingClientRect(); jump(clamp01((e.clientX - r.left) / r.width) * P * 0.99999); };
scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); scrubTo(e); });
scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) scrubTo(e); });

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    e.preventDefault(); setPlaying(false);
    const b = Math.round(pausedAt / BEAT) + (e.code === 'ArrowRight' ? 1 : -1);
    jump(b * BEAT);
  }
  if (e.key === 's') soundBtn.click();
});

function stateAt(t) { let s = 'Button'; for (const [st, , label] of SEQ) if (t >= st) s = label; return s; }

/* ---- sound: synthesized kick on every beat + UI clicks at the event times ---- */
const EVENTS = [
  [1.0, 'click'], [2.0, 'pop'], [3.0, 'click'], [3.5, 'click'], [4.0, 'click'], [5.0, 'tick'], [5.5, 'click'],
  [6.0, 'click'], [7.0, 'tick'], [8.0, 'click'], [9.0, 'click'], [12.0, 'click'],
  [12.5, 'key'], [12.625, 'key'], [12.75, 'key'], [13.0, 'key'], [13.06, 'pop'],
];
for (let b = 0; b < P / BEAT; b++) EVENTS.push([b * BEAT, 'kick']);
let actx = null, soundOn = false, noise = null;
soundBtn.onclick = () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  if (soundOn && !actx) {
    actx = new AudioContext();
    noise = actx.createBuffer(1, actx.sampleRate * 0.05, actx.sampleRate);
    const ch = noise.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 4);
  }
  if (actx && actx.state === 'suspended') actx.resume();
};
function sound(kind) {
  const a = actx, t = a.currentTime, g = a.createGain();
  g.connect(a.destination);
  if (kind === 'kick') {
    const o = a.createOscillator();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); o.start(t); o.stop(t + 0.2);
    return;
  }
  const src = a.createBufferSource(), f = a.createBiquadFilter();
  src.buffer = noise; f.type = 'bandpass';
  f.frequency.value = { click: 2600, key: 4200, tick: 1800, pop: 900 }[kind];
  f.Q.value = kind === 'pop' ? 1.5 : 4;
  g.gain.value = { click: 0.5, key: 0.28, tick: 0.3, pop: 0.45 }[kind];
  src.connect(f); f.connect(g); src.start(t);
}

function frame() {
  const t = now();
  seek(t);
  if (soundOn && playing && actx) {
    const wrapped = t < lastT;
    for (const [et, kind] of EVENTS) if (wrapped ? (et > lastT || et <= t) : (et > lastT && et <= t)) sound(kind);
  }
  lastT = t;
  playhead.style.left = (t / P * 100) + '%';
  const beat = Math.floor(t / BEAT + 1e-6);
  readout.innerHTML = `Bar ${Math.floor(beat / 4) + 1} · Beat ${beat % 4 + 1} <em>— ${stateAt(t)}</em>`;
  requestAnimationFrame(frame);
}

addEventListener('resize', fit);
fit();
seek(pausedAt);
if (!RENDER) window.ready.then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
