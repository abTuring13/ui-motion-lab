<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cursor Share Button</title>
<style>
  :root { color-scheme: dark; --bg: #0d0e12; --fg: #f7f7fa; --dim: #6d6f78; --orange: #ff6a22; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; padding: 16px;
  }
  main { display: grid; justify-items: center; gap: 28px; }
  p { margin: 0; font-size: 14px; color: var(--dim); }

  /* ---- button (1:1 port of the Tailwind classes) ---- */
  .share {
    --cursor-x: 50%;
    --cursor-y: 50%;
    position: relative; isolation: isolate;
    display: inline-grid; place-items: center;
    height: 66px; width: min(200px, calc(100vw - 40px));
    cursor: pointer; overflow: hidden;
    border: 0; border-radius: 9999px;
    background: linear-gradient(110deg, #202029 0%, #181820 48%, #15161b 100%);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--fg);
    box-shadow: inset 0 3px 4px rgba(0,0,0,.72), inset 0 -2px 2px rgba(255,255,255,.07);
    transition: background .3s ease, box-shadow .3s cubic-bezier(.16,1,.3,1);
  }
  .share:hover, .share:focus-visible {
    background: linear-gradient(110deg, #1e1e26 0%, #171820 48%, #121319 100%);
    box-shadow: inset 0 2px 2px rgba(255,255,255,.24), inset 0 -3px 4px rgba(0,0,0,.74), 0 10px 13px rgba(0,0,0,.58);
  }
  .share:focus-visible { outline: 2px solid var(--orange); outline-offset: 7px; }

  /* orange orb that follows the pointer */
  .orb {
    pointer-events: none; position: absolute; z-index: 0;
    display: grid; place-items: center;
    width: 40px; height: 40px; border-radius: 9999px;
    background: var(--orange); color: #090a0f;
    opacity: 0;
    box-shadow: 0 0 0 1px rgba(255,198,139,.48), 0 0 11px 4px rgba(255,111,35,.92),
                0 0 28px 10px rgba(255,91,20,.48), 0 0 42px 16px rgba(255,76,19,.16);
    left: var(--cursor-x); top: var(--cursor-y);
    transform: translate(-50%,-50%) scale(.55);
    transition: transform .3s cubic-bezier(.16,1,.3,1), opacity .2s ease;
  }
  .orb::before {
    content: ""; position: absolute; inset: -30px; z-index: -1; border-radius: 9999px;
    background: radial-gradient(circle, rgba(255,106,34,.34), rgba(255,72,24,.12) 38%, transparent 69%);
  }
  .orb svg { width: 19px; height: 19px; transform: translate(-1px, 1px) rotate(-5deg); }
  .share:hover .orb, .share:focus-visible .orb { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  /* label rolls up and a copy rolls in from below */
  .label { position: relative; z-index: 10; display: grid; place-items: center; height: 25px; overflow: hidden; }
  .label span {
    grid-area: 1 / 1; white-space: nowrap;
    font-size: 17px; font-weight: 400; letter-spacing: -.4px; line-height: 1.15;
    transition: transform .42s cubic-bezier(.16,1,.3,1), opacity .2s ease;
  }
  .label span + span { transform: translateY(145%); opacity: 0; }
  .share:hover .label span:first-child, .share:focus-visible .label span:first-child { transform: translateY(-145%); opacity: 0; }
  .share:hover .label span + span, .share:focus-visible .label span + span { transform: translateY(0); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .share, .orb, .label span { transition: none; }
  }
</style>
</head>
<body>
<main>
  <button type="button" class="share" id="share">
    <span class="orb" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M28.14 4.94 19.6 27.72c-.4 1.06-1.87 1.1-2.33.06l-4.04-9.05-9.03-4.02c-1.04-.46-1-1.93.06-2.33L27.04 3.86c.74-.28 1.38.34 1.1 1.08Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="m13.02 18.63 5.75-5.75" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="label">
      <span>Share it now</span>
      <span aria-hidden="true">Share it now</span>
    </span>
  </button>
  <p>Hover and move your pointer across the button</p>
</main>
<script>
  // Same as the React onPointerEnter / onPointerMove handler: feed the pointer position into CSS vars.
  const btn = document.getElementById('share');
  const updateOrbPosition = e => {
    const b = btn.getBoundingClientRect();
    btn.style.setProperty('--cursor-x', `${e.clientX - b.left}px`);
    btn.style.setProperty('--cursor-y', `${e.clientY - b.top - 14}px`);
  };
  btn.addEventListener('pointerenter', updateOrbPosition);
  btn.addEventListener('pointermove', updateOrbPosition);
</script>
</body>
</html>
